<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Toán Tư Duy</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#ff9ec7">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#fff0f6;--card:#fff;--ink:#3b2f2f;--pri:#ff5c9a;--sh:#f5b3cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Baloo 2","Segoe UI",Arial,sans-serif;background:linear-gradient(#ffd1e6,#fff0f6 45%);color:var(--ink);min-height:100vh;user-select:none;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:none;color:inherit}
/* ── Trang trí nền ── */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg span{position:absolute;opacity:.85}
.cloud{font-size:70px;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
.balloon{font-size:40px;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(105vh) rotate(-8deg)}50%{transform:translateY(50vh) rotate(8deg)}to{transform:translateY(-120px) rotate(-8deg)}}
.twinkle{font-size:22px;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
.grass{position:fixed;left:0;right:0;bottom:0;height:46px;background:#ffc2dc;border-radius:50% 50% 0 0/30px 30px 0 0;z-index:0;font-size:26px;letter-spacing:22px;text-align:center;line-height:20px;overflow:hidden;white-space:nowrap}
/* ── Thanh trên ── */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#ff9ec7;box-shadow:0 3px 0 #e57aa8;border-radius:0 0 22px 22px}
.back{background:#fff;border-radius:14px;width:44px;height:44px;font-size:20px;flex:none}
.who{display:flex;align-items:center;gap:8px;background:#fff8;border-radius:22px;padding:3px 12px 3px 3px;font-weight:bold;font-size:18px;min-width:0}
.who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.av{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;flex:none;border:3px solid #fff}
.av img{width:100%;height:100%;object-fit:cover}
.sp{flex:1}
.chip{background:#fff;border-radius:16px;padding:6px 10px;font-weight:bold;font-size:17px;white-space:nowrap}
main{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:16px 16px 90px}
.title{font-size:26px;font-weight:800;text-align:center;margin:6px 0 14px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-size:32px;font-weight:900;color:#e0408a;text-shadow:0 3px 0 #fff;animation:popin .5s}
.brand img{width:56px;height:56px;border-radius:16px;box-shadow:0 4px 0 #e57aa8;animation:bob 2.4s infinite}
.install{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600;padding:12px 14px;border:3px dashed #ff9ec7}
.install img{width:56px;height:56px;border-radius:14px;flex:none}.install .btn{display:inline-block;text-decoration:none;font-size:18px;padding:8px 16px;margin:8px 0 0}
/* ── Ô chủ đề ── */
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.tile{position:relative;background:var(--card);border-radius:26px;padding:16px 10px 12px;font-size:19px;font-weight:800;box-shadow:0 6px 0 var(--sh);display:flex;flex-direction:column;align-items:center;gap:6px;animation:popin .45s backwards;transition:transform .15s}
.tile:hover{transform:translateY(-4px) rotate(-1.5deg)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
.tile .ic{font-size:54px;animation:bob 2.6s ease-in-out infinite}
.tile .deco{position:absolute;top:-10px;right:-6px;font-size:28px;animation:bob 3s ease-in-out infinite reverse}
.pbar{width:85%;height:10px;background:#0001;border-radius:6px;overflow:hidden}.pbar i{display:block;height:100%;background:#3cb371;border-radius:6px}
.small{font-size:14px;font-weight:600;color:#8a6d5b}
.bigbtn{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 18px;padding:14px 18px;border-radius:26px;background:linear-gradient(90deg,#ff7eb3,#c77dff);color:#fff;font-size:24px;font-weight:800;box-shadow:0 6px 0 #a855c7;animation:popin .4s backwards}
.bigbtn .ic{font-size:50px;animation:bob 2s ease-in-out infinite}
@keyframes popin{from{opacity:0;transform:scale(.6)}}
@keyframes bob{50%{transform:translateY(-6px)}}
/* ── Bản đồ màn ── */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px}
.lv{aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 5px 0 var(--sh);font-size:22px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;animation:popin .3s backwards}
.lv small{font-size:11px;letter-spacing:-1px}
.lv.lock{background:#eee;color:#bbb;box-shadow:0 5px 0 #ccc}
.lv.now{background:#ff9ec7;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
/* ── Câu hỏi ── */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qbar{flex:1;height:16px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:inset 0 2px 0 #0001}.qbar i{display:block;height:100%;background:linear-gradient(90deg,#7bd16b,#3cb371);transition:width .4s}
.q{font-size:23px;font-weight:800;text-align:center;margin:8px 0 14px;display:flex;align-items:center;justify-content:center;gap:10px;animation:slide .4s}
@keyframes slide{from{opacity:0;transform:translateY(-14px)}}
.speak{background:#ffd6e8;border-radius:50%;width:50px;height:50px;font-size:24px;flex:none;box-shadow:0 4px 0 #f0a3c4;animation:bob 2s infinite}
.stage{background:var(--card);border-radius:26px;padding:18px;text-align:center;font-size:46px;line-height:1.25;box-shadow:0 6px 0 var(--sh);animation:popin .35s}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:20px}
.opts.col{flex-direction:column;align-items:center}.opts.col .opt{min-width:280px}
.opts.bottom{align-items:flex-end}
.opt{background:#fff;border-radius:22px;min-width:88px;min-height:88px;padding:10px 14px;font-size:44px;font-weight:800;box-shadow:0 6px 0 var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;animation:popin .4s backwards;transition:transform .12s}
.opt:hover{transform:scale(1.05)}.opt:active{transform:scale(.95)}
.ok{background:#c8f7d4!important;box-shadow:0 6px 0 #7fd39a!important;animation:yay .5s!important}
.bad{background:#ffd0d0!important;animation:shake .4s!important}
.hint{animation:glow 1s infinite!important}
@keyframes yay{50%{transform:scale(1.2) rotate(4deg)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes glow{50%{box-shadow:0 0 0 8px #ff9ec7}}
.rows{display:grid;grid-template-columns:repeat(5,auto);justify-content:center;gap:2px 8px}
.rows.sm{font-size:30px;gap:0 4px}
.dots{display:grid;grid-template-columns:repeat(3,14px);gap:5px;justify-content:center;padding:4px}.dots i{width:14px;height:14px;border-radius:50%;background:#ff7a59}
.opt .dots{grid-template-columns:repeat(5,10px)}.opt .dots i{width:10px;height:10px}
.domino{display:inline-flex;align-items:center;gap:10px;background:#fff3f8;border:4px solid #3b2f2f;border-radius:18px;padding:14px}.domino hr{width:4px;height:70px;background:#3b2f2f;border:0;margin:0}.domino .dots{grid-template-columns:repeat(3,22px);gap:8px}.domino .dots i{width:22px;height:22px;background:#3b2f2f}
.pair{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}.pair.mid{align-items:center}
.sign{font-size:40px}
.box{background:#fff3f8;border:3px dashed var(--sh);border-radius:18px;padding:8px 12px;min-width:90px}
.gach{position:relative;opacity:.45;text-decoration:none}.gach::after{content:'';position:absolute;left:-4px;right:-4px;top:50%;border-top:5px solid #e5484d;transform:rotate(-30deg)}
.house{display:inline-block}.roof{width:0;height:0;margin:0 auto;border-left:140px solid transparent;border-right:140px solid transparent;border-bottom:84px solid #ff7a59;position:relative}
.roof b{position:absolute;left:-30px;width:60px;top:22px;color:#fff;font-size:46px}
.rooms{display:flex;gap:10px;background:#ffd6e8;padding:10px;border-radius:0 0 16px 16px}.rooms .box{flex:1}.box.q{font-size:44px;display:flex;align-items:center;justify-content:center}
.bignum{display:inline-block;background:#ff9ec7;border-radius:50%;width:90px;height:90px;line-height:90px;font-weight:800}
.seq{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.seq b{width:64px;height:64px;border-radius:50%;background:#d9f0ff;display:flex;align-items:center;justify-content:center;font-size:36px}.seq.em b{background:#ffe3ef;font-size:38px}
.seq b.hole{background:#ff9ec7;animation:pulse 1.2s infinite}
.branch{border-bottom:10px solid #9b6b43;border-radius:4px;padding:0 10px}
.flyin{animation:flyin 1.6s ease-out}@keyframes flyin{from{transform:translate(120px,-60px);opacity:0}}
.flyaway{opacity:.45;animation:flyaway 1.6s ease-out forwards}@keyframes flyaway{from{transform:translateY(40px);opacity:1}to{transform:translate(60px,-10px)}}
.bar{height:34px;border-radius:17px;margin:4px auto}
.tower{display:flex;flex-direction:column;gap:3px}.tower i{display:block;width:44px;height:26px;border-radius:6px}
.scatter{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:520px;margin:auto}
.sample{display:inline-block;border:4px dashed #ffb03b;border-radius:20px;padding:10px}
.big{font-size:90px;animation:bob 2s infinite}
.frame{background:#fff3f8;border-radius:16px;padding:6px;margin:6px auto;max-width:520px;font-size:42px;min-height:66px}
.grid{display:inline-grid;gap:6px}
.cell{width:54px;height:54px;font-size:34px;background:#fff3f8;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0}
button.cell{box-shadow:0 3px 0 var(--sh)}
/* ── Chinh phục ── */
.isles{display:flex;flex-direction:column;align-items:center;gap:6px}
.isle{display:flex;align-items:center;gap:12px;width:min(420px,100%);background:#fff;border-radius:40px;padding:8px 18px 8px 8px;box-shadow:0 6px 0 #f5b3cf;font-size:20px;font-weight:800;animation:popin .4s backwards}
.isle:nth-child(even){margin-left:80px}.isle:nth-child(odd){margin-right:80px}
.isle .ic{font-size:44px;width:64px;height:64px;border-radius:50%;background:#ffd6e8;display:flex;align-items:center;justify-content:center}
.isle.lock{filter:grayscale(1);opacity:.6}
.isle.won .ic{background:#ffd6e8}
.path{display:flex;align-items:center;justify-content:space-between;background:#ffd6e8;border-radius:30px;padding:8px 12px;margin-bottom:8px}
.stone{width:22px;height:22px;border-radius:50%;background:#fff;position:relative;flex:none}.stone.done{background:#7bd16b}
.stone .me{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:30px;width:40px;height:40px}
.hearts{font-size:26px;letter-spacing:2px}
/* ── Hồ sơ & huy chương ── */
.panel{background:#fff;border-radius:26px;padding:18px;box-shadow:0 6px 0 var(--sh);margin-bottom:16px}
.avbig{width:120px;height:120px;font-size:80px;margin:0 auto 10px;border:5px solid #ff9ec7}
.avs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.avs button{font-size:36px;background:#fff3f8;border-radius:50%;width:58px;height:58px}.avs button.sel{outline:4px solid #ff7a59}
input[type=text]{font:inherit;font-size:24px;padding:10px 16px;border-radius:16px;border:3px solid #ff9ec7;width:100%;text-align:center}
.btn{background:var(--pri);color:#fff;border-radius:18px;padding:12px 22px;font-size:21px;font-weight:800;margin:6px;box-shadow:0 5px 0 #d43f7c}
.btn.alt{background:#4fb3ff;box-shadow:0 5px 0 #2f86c6}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;text-align:center}.stats div{background:#fff3f8;border-radius:16px;padding:10px;font-size:15px}.stats b{display:block;font-size:26px}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.medal{background:#fff;border-radius:22px;padding:12px;text-align:center;box-shadow:0 5px 0 var(--sh);font-weight:700;font-size:15px}.medal .ic{font-size:50px;display:block}
.medal.lock .ic{filter:grayscale(1) opacity(.35)}.medal.lock{color:#aaa}
.medal:not(.lock) .ic{animation:bob 2.4s infinite}
.done{text-align:center;font-size:26px;font-weight:800}
.done .big{font-size:100px}
.starrow{font-size:60px}.starrow span{display:inline-block;animation:popin .5s backwards}
/* ── Hiệu ứng ── */
.confetti{position:fixed;top:-40px;z-index:20;pointer-events:none;font-size:30px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:21;background:#fff;border-radius:30px;padding:20px 30px;text-align:center;font-size:24px;font-weight:800;box-shadow:0 10px 40px #0003;animation:popin .4s}
.toast .ic{font-size:80px;display:block}
.mascot{position:fixed;right:12px;bottom:14px;z-index:6;font-size:58px;animation:bob 2s infinite;cursor:pointer}
.bubble{position:fixed;right:20px;bottom:90px;z-index:6;background:#fff;border-radius:18px;padding:8px 14px;font-weight:800;font-size:18px;box-shadow:0 4px 12px #0002;display:none;max-width:220px}
.bubble.show{display:block;animation:popin .3s}
@media (max-width:520px){.who b{max-width:70px}.chip{font-size:14px;padding:5px 7px}.isle:nth-child(n){margin:0}.roof{border-left-width:110px;border-right-width:110px}.cell{width:44px;height:44px;font-size:28px}}
/* ── Hàng nút nhỏ ở trang chủ ── */
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:4px 0 16px}
.qb{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border-radius:22px;padding:8px 10px;min-width:78px;font-size:13px;font-weight:800;box-shadow:0 5px 0 var(--sh);animation:popin .4s backwards}
.qb .ic{font-size:34px}
.qb.glow{background:#fff3c4;animation:pulse 1.2s infinite}
.qb .dot{position:absolute;top:-6px;right:-6px;background:#e5484d;color:#fff;border-radius:12px;padding:0 7px;font-size:12px}
/* ── Đếm bằng cách chạm, hiệu ứng khi đúng ── */
.stage .rows span{position:relative;cursor:pointer;border-radius:50%}
.stage .rows span.counted{background:#c8f7d4}
.stage .rows span.counted::after{content:attr(data-n);position:absolute;top:-6px;right:-8px;background:#3cb371;color:#fff;font-size:14px;font-weight:800;border-radius:10px;padding:0 6px;line-height:20px}
.win .rows span,.win .big,.win .char{animation:jump .6s calc(var(--i,0)*70ms) both}
@keyframes jump{40%{transform:translateY(-22px) scale(1.15)}}
.tower i{animation:drop .45s calc(var(--i)*90ms) backwards}
@keyframes drop{from{transform:translateY(-120px);opacity:0}}
.story{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.char{font-size:80px;display:inline-block;animation:bob 2s infinite}
.char.happy{animation:jump .5s 3}
.char.sad{animation:tilt 1s}
@keyframes tilt{30%,70%{transform:rotate(-14deg)}}
.burst{position:fixed;z-index:22;pointer-events:none;font-size:26px;animation:burst .8s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.gname{background:#fff;border-radius:14px;padding:3px 10px;font-size:15px;font-weight:700}
/* ── Kéo thả ── */
.piece{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;font-size:44px;background:#fff;border-radius:18px;box-shadow:0 4px 0 var(--sh);touch-action:none;cursor:grab;position:relative}
.piece.dragging{z-index:30;transition:none;box-shadow:0 12px 20px #0003}
.piece.back{animation:shake .4s}
.pile{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;min-height:84px}
.zones{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:10px}
.zone{background:#fff3f8;border:4px dashed var(--sh);border-radius:24px;padding:8px;min-width:120px;min-height:120px;display:flex;flex-direction:column;align-items:center;gap:4px}
.zone .zl{font-size:56px;display:flex;flex-direction:column;align-items:center;line-height:1.1}.zone .zl small{font-size:15px;font-weight:800}
.zone .slot{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}.zone .slot .piece{width:48px;height:48px;font-size:32px;cursor:default}
.zone.hot{background:#c8f7d4}
.basket{min-width:240px;min-height:170px;background:#fff3e0;border-color:#e0a060;position:relative}
.basket .zl{font-size:22px;font-weight:900;background:#ff9ec7;color:#fff;border-radius:14px;padding:2px 14px}
.basket .slot .piece{cursor:pointer}
.dragwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
/* ── Lật thẻ ── */
.cards{display:inline-grid;gap:10px}
.card{width:84px;height:96px;border-radius:18px;background:linear-gradient(135deg,#ff7eb3,#c77dff);color:#fff;font-size:40px;box-shadow:0 5px 0 #a855c7;display:flex;align-items:center;justify-content:center;transition:transform .25s}
.card .face{display:none}.card.flip{background:#fff;color:var(--ink);transform:rotateY(180deg)}.card.flip .face{display:block;transform:rotateY(180deg)}.card.flip .back{display:none}
.card.match{background:#c8f7d4;box-shadow:0 5px 0 #7fd39a}
.card .num{font-size:46px}.rows.xs{font-size:15px;grid-template-columns:repeat(5,auto);gap:0}
/* ── Mê cung ── */
/* Ô tự co giãn: vừa khít bề ngang màn hình điện thoại, to tối đa 104px trên máy tính bảng */
.stage.mazest{padding:12px}
.maze{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:clamp(5px,1.6vw,10px);width:min(100%,calc(var(--n) * 104px));margin:0 auto}
.mz{aspect-ratio:1;width:100%;border-radius:18%;background:#fff3f8;font-size:clamp(26px,8vw,46px);font-weight:900;box-shadow:0 5px 0 var(--sh);position:relative;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation}
.mz:active{transform:scale(.94)}
.mz.walk{background:#c8f7d4;box-shadow:0 5px 0 #7fd39a}
.mz .an{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,11vw,64px);background:#fffc;border-radius:18%;animation:popin .3s}
.mz.home{background:#ffe3ef;outline:4px dashed #ff9ec7;outline-offset:-4px}
.mz .hm{position:absolute;top:-16%;right:-14%;font-size:clamp(22px,7vw,40px);animation:bob 1.6s infinite}
/* ── Tô màu ── */
.paint{display:inline-grid;gap:2px;background:#ccc;padding:2px;border-radius:10px}
.px{width:40px;height:40px;background:#fff;font-size:16px;font-weight:800;color:#999;padding:0;border-radius:4px;transition:background .3s}
.px.done{color:transparent}
.pals{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.pal{width:62px;height:62px;border-radius:50%;font-size:26px;font-weight:900;color:#fff;text-shadow:0 2px 2px #0006;box-shadow:0 4px 0 #0002;border:4px solid #fff}
.pal.sel{outline:5px solid #3b2f2f;transform:scale(1.12)}
/* ── Cửa hàng nhỏ ── */
.shopq{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.tag{background:#ffd36e;border-radius:14px;padding:4px 14px;font-size:30px;font-weight:900}
.tray{min-height:90px;min-width:240px;background:#fff3e0;border:4px dashed #e0a060;border-radius:22px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px}
.coin{width:56px;height:56px;border-radius:50%;background:radial-gradient(#ffe066,#f0b400);border:3px solid #c98f00;font-size:24px;font-weight:900;color:#7a5200;box-shadow:0 3px 0 #a87500}
.coin.c2{background:radial-gradient(#e0e0e0,#a8a8a8);border-color:#888;color:#444;box-shadow:0 3px 0 #777}
.coin.c5{background:radial-gradient(#ffc9a0,#e08040);border-color:#b05a20;color:#5a2a00;box-shadow:0 3px 0 #8a4010;width:64px;height:64px}
/* ── Trùm cuối ── */
.boss{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#4a2a6a,#8a3a8a);color:#fff;border-radius:22px;padding:8px 16px;margin-bottom:8px;font-weight:800;animation:popin .4s}
.boss .bi{font-size:56px;animation:shake 1.2s infinite}
.boss.beat .bi{animation:poof .8s forwards}
@keyframes poof{50%{transform:scale(1.5) rotate(180deg)}to{transform:scale(0) rotate(360deg);opacity:0}}
/* ── Thẻ sưu tầm, phòng, cửa hàng ── */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.stk{background:#fff;border-radius:18px;padding:8px 4px;text-align:center;font-size:13px;font-weight:800;box-shadow:0 4px 0 var(--sh);position:relative}
.stk .ic{font-size:46px;display:block}
.stk.no .ic{filter:brightness(0) opacity(.15)}.stk.no{color:#bbb}
.stk .cnt{position:absolute;top:4px;right:6px;font-size:11px;background:#ff9ec7;color:#fff;border-radius:8px;padding:0 5px}
.reveal{display:inline-block;background:linear-gradient(135deg,#fff3c4,#ffd6e8);border-radius:22px;padding:12px 22px;margin:10px;animation:spinin .9s}
.reveal .ic{font-size:70px;display:block}
@keyframes spinin{from{transform:rotateY(720deg) scale(.2)}}
.room{position:relative;height:300px;border-radius:26px;overflow:hidden;background:linear-gradient(#ffe3ef 62%,#e8c4a0 62%);box-shadow:0 6px 0 var(--sh);margin-bottom:14px}
.room .owl{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-size:96px;animation:bob 2s infinite}
.room .owl .hat{position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:52px}
.room .it{position:absolute;font-size:46px;animation:popin .4s backwards}
.room .win{position:absolute;left:8%;top:10%;font-size:46px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.si{background:#fff;border-radius:20px;padding:10px;text-align:center;box-shadow:0 5px 0 var(--sh);font-weight:800;font-size:15px}
.si .ic{font-size:46px;display:block}
.si button{margin-top:6px;border-radius:12px;padding:6px 10px;font-weight:800;background:#ffd36e;font-size:15px}
.si button.have{background:#c8f7d4}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:#fff;border-radius:16px;padding:8px 14px;font-weight:800;box-shadow:0 4px 0 var(--sh)}
.tabs button.on{background:#ff9ec7;color:#fff}
.heart{position:fixed;z-index:22;pointer-events:none;font-size:34px;animation:floatup 1.4s ease-out forwards}
@keyframes floatup{to{transform:translateY(-140px) scale(1.4);opacity:0}}
.mascot .hat{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:32px}
.mascot.happy{animation:jump .5s 2}.mascot.sad{animation:tilt 1s}
/* ── Bố mẹ ── */
.modal{position:fixed;inset:0;background:#0006;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .panel{max-width:380px;width:100%}
.chart{display:flex;align-items:flex-end;gap:8px;height:160px;padding:8px;background:#fff3f8;border-radius:16px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;font-weight:700}
.chart i{display:block;width:70%;background:linear-gradient(#ff7eb3,#c77dff);border-radius:8px 8px 0 0;min-height:2px}
.acc{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:700}.acc .t{width:130px}.acc .b{flex:1;height:18px;background:#0001;border-radius:10px;overflow:hidden}.acc .b i{display:block;height:100%;border-radius:10px}
.clip{display:flex;align-items:center;gap:8px;background:#fff3f8;border-radius:14px;padding:6px 10px;margin:6px 0}
.rcd{font-size:56px;font-weight:900;color:#e0408a;margin:10px 0}
@media (max-width:520px){main{padding-left:10px;padding-right:10px}.px{width:34px;height:34px}.card{width:66px;height:80px;font-size:32px}.zone{min-width:96px;min-height:100px}.piece{width:56px;height:56px;font-size:38px}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="grass">🌼🌷🌱🌻🌼🌱🌷🌻🌼🌱🌷🌼🌻🌱🌷🌼🌻🌱🌷🌼</div>
<header>
  <button class="back" id="back" style="visibility:hidden">⬅️</button>
  <button class="who" onclick="showProfile()"><div class="av" id="hav"></div><b id="hname"></b></button>
  <div class="sp"></div>
  <span class="chip" title="Thời gian học hôm nay">⏱ <span id="htime">0'</span></span>
  <span class="chip" title="Ngôi sao">⭐ <span id="hstar">0</span></span>
  <button class="chip" title="Xu để mua đồ" onclick="showRoom()">🪙 <span id="hcoin">0</span></button>
  <button class="chip" id="hmusic" onclick="toggleMusic()">🎵</button>
</header>
<main id="app"></main>
<div class="mascot" id="mascot" onclick="cheerUp()"><span class="hat" id="mhat"></span>🦉</div>
<div class="bubble" id="bubble"></div>
<script src="nhac.js"></script>
<script src="games.js"></script>
<script src="app.js"></script>
</body>
</html>
